<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>混合注意力知识库 · 架构、显存与缓存</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --paper: #fffefa;
      --ink: #202d2a;
      --muted: #66746d;
      --line: #dce0d6;
      --green: #17634d;
      --soft: #e9f1e9
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif
    }

    a {
      color: var(--green);
      text-underline-offset: 4px
    }

    button,
    input {
      font: inherit
    }

    button {
      cursor: pointer
    }

    main,
    footer {
      max-width: 1200px;
      margin: auto;
      padding: 0 32px
    }

    .muted {
      color: var(--muted)
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 16px 0 10px
    }

    .search {
      flex: 1;
      max-width: 470px;
      position: relative
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 14px;
      color: var(--muted);
      pointer-events: none
    }

    input[type=search] {
      width: 100%;
      background: var(--paper);
      border: 1px solid #bac8b9;
      border-radius: 8px;
      padding: 10px 14px 10px 42px;
      color: var(--ink)
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .filters button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 24px;
      font-size: 13px
    }

    .filters button[aria-pressed=true] {
      background: var(--green);
      border-color: var(--green);
      color: white
    }

    .document-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0
    }

    .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, max-content);
      align-items: start;
      gap: 4px 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--ink);
      overflow-wrap: anywhere;
      transition: border-color .16s, box-shadow .16s
    }

    .card:hover {
      border-color: #8da997;
      box-shadow: 0 12px 30px #203b320d
    }

    .card-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px 10px
    }

    .card-meta {
      display: grid;
      justify-self: end;
      max-width: 12em;
      text-align: right;
      color: var(--muted);
      font-size: 13px
    }

    .card-time {
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .category {
      font-size: 12px;
      color: var(--green);
      background: var(--soft);
      padding: 1px 7px;
      border-radius: 5px
    }

    .card h2 {
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: -.02em;
      margin: 0
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      margin: 2px 0 0
    }

    .open {
      white-space: nowrap;
      color: var(--green);
      font-size: 13px;
      font-weight: 650
    }

    .empty {
      padding: 40px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
      color: var(--muted)
    }

    [hidden] {
      display: none !important
    }

    .footnote {
      font-size: 13px;
      color: var(--muted);
      margin: 26px 0 48px;
      max-width: 850px
    }

    footer {
      padding-top: 20px;
      padding-bottom: 30px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
      color: var(--muted)
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #d8924c;
      outline-offset: 4px
    }

    @media(max-width:600px) {

      main,
      footer {
        padding-left: 20px;
        padding-right: 20px
      }

      .tools {
        align-items: flex-start;
        flex-direction: column
      }

      .search {
        width: 100%;
        max-width: none
      }

      footer {
        flex-wrap: wrap
      }

      .card {
        padding: 8px 10px;
        column-gap: 10px
      }

      .card-content {
        display: contents
      }

      .card p {
        grid-column: 1 / -1;
        grid-row: 2
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .card {
        transition: none
      }

    }
  </style>
</head>
