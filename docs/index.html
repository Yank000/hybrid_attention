  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --paper: #fffefa;
      --ink: #202d2a;
      --muted: #66746d;
      --line: #dce0d6;
      --green: #17634d;
      --soft: #e9f1e9
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif
    }

    a {
      color: var(--green);
      text-underline-offset: 4px
    }

    button,
    input {
      font: inherit
    }

    button {
      cursor: pointer
    }

    header,
    main,
    footer {
      max-width: 1200px;
      margin: auto;
      padding: 0 32px
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 28px;
      font-size: 12px;
      letter-spacing: .08em
    }

    .brand {
      font-size: inherit;
      margin: 0;
      font-weight: 750
    }

    .muted {
      color: var(--muted)
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 35px 0 18px
    }

    .search {
      flex: 1;
      max-width: 470px;
      position: relative
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 14px;
      color: var(--muted);
      pointer-events: none
    }

    input[type=search] {
      width: 100%;
      background: var(--paper);
      border: 1px solid #bac8b9;
      border-radius: 8px;
      padding: 10px 14px 10px 42px;
      color: var(--ink)
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px
    }

    .filters button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 24px;
      font-size: 13px
    }

    .filters button[aria-pressed=true] {
      background: var(--green);
      border-color: var(--green);
      color: white
    }

    .document-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0
    }

    .card {
      display: block;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: var(--ink);
      overflow-wrap: anywhere;
      transition: border-color .16s, box-shadow .16s
    }

    .card:hover {
      border-color: #8da997;
      box-shadow: 0 12px 30px #203b320d
    }

    .card-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px 16px
    }

    .card-meta {
      display: grid;
      grid-column: -2 / -1;
      justify-self: end;
      text-align: right;
      color: var(--muted);
      font-size: 13px
    }

    .card-time {
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .category {
      font-size: 12px;
      color: var(--green);
      background: var(--soft);
      padding: 3px 10px;
      border-radius: 5px
    }

    .card h2 {
      font-size: 21px;
      line-height: 1.4;
      letter-spacing: -.02em;
      margin: 0
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      margin: 6px 0 0
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 10px
    }

    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .tag {
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--muted)
    }

    .open {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: 13px;
      font-weight: 650
    }

    .empty {
      padding: 40px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
      color: var(--muted)
    }

    [hidden] {
      display: none !important
    }

    .footnote {
      font-size: 13px;
      color: var(--muted);
      margin: 26px 0 48px;
      max-width: 850px
    }

    footer {
      padding-top: 20px;
      padding-bottom: 30px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
      color: var(--muted)
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #d8924c;
      outline-offset: 4px
    }

    @media(max-width:600px) {

      header,
      main,
      footer {
        padding-left: 20px;
        padding-right: 20px
      }

      .tools {
        align-items: flex-start;
        flex-direction: column
      }

      .search {
        width: 100%;
        max-width: none
      }

      .top,
      footer {
        flex-wrap: wrap
      }

      .card {
        padding: 16px
      }

      .card-heading {
        grid-template-columns: auto minmax(0, 1fr);
        justify-items: start
      }

      .card h2 {
        grid-column: 1 / -1
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .card {
        transition: none
      }

    }
  </style>
</head>
